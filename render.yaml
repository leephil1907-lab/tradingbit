# Render Blueprint for PrimeVest Atlas (Phase 0/1).
# Web service is live today (paper product). The worker cron is intentionally
# commented until Phase 2 wires fills/decisions to Postgres — otherwise the web
# service would keep serving a stale committed snapshot with no way to update it.
services:
  - type: web
    name: primevest-atlas
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_PRIMEVEST_URL
        value: https://vantabrokerage.vercel.app
      - key: PAPER_MODE
        value: "true"

